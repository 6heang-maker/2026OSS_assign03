<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Friend</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="my.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            Friend Manager
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">List</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="add.html">Add</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="example.html">Example</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<main class="container main">

    <div class="form-box">

        <h1>Add Friend</h1>
        <p>새로운 친구 정보를 입력합니다.</p>


        <div class="card">

            <div class="card-body">

                <form id="friendForm">

                    <div class="mb-3">

                        <label for="name" class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-3">

                        <label for="relationship" class="form-label">
                            Relationship
                        </label>

                        <select id="relationship"
                                class="form-select"
                                required>

                            <option value="">관계 선택</option>
                            <option>학교친구</option>
                            <option>동아리친구</option>
                            <option>고향친구</option>
                            <option>교회친구</option>
                            <option>기타</option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="phone" class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               id="phone"
                               class="form-control"
                               placeholder="010-1234-5678"
                               required>

                    </div>


                    <div class="mb-3">

                        <label for="email" class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="example@gmail.com"
                               required>

                    </div>


                    <div class="mb-3">

                        <label for="address" class="form-label">
                            Address
                        </label>

                        <input type="text"
                               id="address"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-3">

                        <label for="birthday" class="form-label">
                            Birthday
                        </label>

                        <input type="date"
                               id="birthday"
                               class="form-control"
                               required>

                    </div>


                    <button type="submit"
                            class="btn btn-primary">

                        Add

                    </button>


                    <a href="index.html"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>
        </div>

    </div>

</main>


<footer>
    Friend Manager
</footer>


<script>

document.getElementById("friendForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value;
    let relationship = document.getElementById("relationship").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
    let address = document.getElementById("address").value;
    let birthday = document.getElementById("birthday").value;


    if (name.length < 2) {

        alert("이름은 2글자 이상 입력해주세요.");
        return;

    }


    if (relationship == "") {

        alert("관계를 선택해주세요.");
        return;

    }


    if (phone == "") {

        alert("전화번호를 입력해주세요.");
        return;

    }


    if (!email.includes("@")) {

        alert("이메일 형식을 확인해주세요.");
        return;

    }


    if (address == "") {

        alert("주소를 입력해주세요.");
        return;

    }


    if (birthday == "") {

        alert("생일을 입력해주세요.");
        return;

    }


    alert("친구 정보가 추가됩니다.");

    location.href = "index.html";

});

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
