<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Friend Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="my.css">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="index.html">

            Friend Manager

        </a>

    </div>

</nav>


<main class="container page-container">


    <div class="form-box">


        <div class="d-flex
                    justify-content-between
                    align-items-center
                    flex-wrap
                    gap-2
                    mb-4">


            <div>

                <h1>Friend Detail</h1>

                <p class="text-secondary">
                    선택한 친구의 상세 정보입니다.
                </p>

            </div>


            <a href="index.html"
               class="btn btn-outline-secondary">

                Back to List

            </a>


        </div>


        <div class="card shadow-sm">


            <div class="card-body p-4">


                <div class="detail-row">

                    <strong>Name</strong>

                    <span>김민수</span>

                </div>


                <div class="detail-row">

                    <strong>Relationship</strong>

                    <span>학교친구</span>

                </div>


                <div class="detail-row">

                    <strong>Phone</strong>

                    <span>010-1234-5678</span>

                </div>


                <div class="detail-row">

                    <strong>Email</strong>

                    <span>minsu@example.com</span>

                </div>


                <div class="detail-row">

                    <strong>Address</strong>

                    <span>경상북도 포항시</span>

                </div>


                <div class="detail-row">

                    <strong>Birthday</strong>

                    <span>2004-03-15</span>

                </div>


                <div class="detail-row">

                    <strong>Memo</strong>

                    <span>대학교에서 만난 친구</span>

                </div>


                <div class="d-flex
                            gap-2
                            flex-column
                            flex-sm-row
                            mt-4">


                    <a href="edit.html"
                       class="btn btn-primary">

                        Edit

                    </a>


                    <button type="button"
                            class="btn btn-danger"
                            onclick="deleteFriend()">

                        Delete

                    </button>


                </div>


            </div>

        </div>

    </div>

</main>


<footer>
    Friend Manager CRUD Frontend
</footer>


<script>

function deleteFriend() {

    const answer =
        confirm("친구 정보를 삭제할까요?");


    if (answer) {

        alert("친구 정보가 삭제됩니다.");

        location.href = "index.html";

    }

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
