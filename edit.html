<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Friend</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="my.css">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="index.html">

            Friend Manager

        </a>

    </div>

</nav>


<main class="container page-container">


    <div class="form-box">


        <h1>Edit Friend</h1>

        <p class="text-secondary">
            친구 정보를 수정합니다.
        </p>


        <div class="card shadow-sm">


            <div class="card-body p-4">


                <form id="editForm">


                    <div class="mb-3">

                        <label for="name"
                               class="form-label">

                            Name *

                        </label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               value="김민수">

                    </div>


                    <div class="mb-3">

                        <label for="relationship"
                               class="form-label">

                            Relationship *

                        </label>

                        <select id="relationship"
                                class="form-select">

                            <option value="">
                                Select Relationship
                            </option>

                            <option selected>
                                학교친구
                            </option>

                            <option>
                                동아리친구
                            </option>

                            <option>
                                고향친구
                            </option>

                            <option>
                                교회친구
                            </option>

                            <option>
                                기타
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="phone"
                               class="form-label">

                            Phone *

                        </label>

                        <input type="tel"
                               id="phone"
                               class="form-control"
                               value="010-1234-5678">

                    </div>


                    <div class="mb-3">

                        <label for="email"
                               class="form-label">

                            Email *

                        </label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               value="minsu@example.com">

                    </div>


                    <div class="mb-3">

                        <label for="address"
                               class="form-label">

                            Address *

                        </label>

                        <input type="text"
                               id="address"
                               class="form-control"
                               value="경상북도 포항시">

                    </div>


                    <div class="mb-3">

                        <label for="birthday"
                               class="form-label">

                            Birthday *

                        </label>

                        <input type="date"
                               id="birthday"
                               class="form-control"
                               value="2004-03-15">

                    </div>


                    <div class="mb-4">

                        <label for="memo"
                               class="form-label">

                            Memo

                        </label>

                        <textarea id="memo"
                                  class="form-control"
                                  rows="3">대학교에서 만난 친구</textarea>

                    </div>


                    <div class="d-flex
                                gap-2
                                flex-column
                                flex-sm-row">


                        <button type="submit"
                                class="btn btn-primary">

                            Save

                        </button>


                        <a href="view.html"
                           class="btn btn-outline-secondary">

                            Cancel

                        </a>


                    </div>


                </form>

            </div>

        </div>

    </div>

</main>


<footer>
    Friend Manager CRUD Frontend
</footer>


<script>

document.getElementById("editForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const relationship =
        document.getElementById("relationship").value;

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const birthday =
        document.getElementById("birthday").value;

    const memo =
        document.getElementById("memo").value.trim();


    const phonePattern =
        /^010-\d{4}-\d{4}$/;

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (name.length < 2) {

        alert("이름은 2글자 이상 입력해주세요.");

        return;

    }


    if (relationship === "") {

        alert("친구 관계를 선택해주세요.");

        return;

    }


    if (!phonePattern.test(phone)) {

        alert("전화번호는 010-1234-5678 형식으로 입력해주세요.");

        return;

    }


    if (!emailPattern.test(email)) {

        alert("올바른 이메일 형식을 입력해주세요.");

        return;

    }


    if (address === "") {

        alert("주소를 입력해주세요.");

        return;

    }


    if (birthday === "") {

        alert("생일을 입력해주세요.");

        return;

    }


    if (memo.length > 100) {

        alert("메모는 100자 이하로 입력해주세요.");

        return;

    }


    const answer =
        confirm("친구 정보를 수정할까요?");


    if (answer) {

        alert("친구 정보가 수정됩니다.");

        location.href = "view.html";

    }

});

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
